<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>webssh selftest</title>
  <style>
    body { background:#0f172a; color:#e2e8f0; font-family: ui-monospace, monospace; padding:1rem; }
    pre { white-space: pre-wrap; }
    .pass { color:#34d399; font-weight:bold; }
    .fail { color:#f87171; font-weight:bold; }
    .skip { color:#fbbf24; font-weight:bold; }
    h2 { font-size:1rem; color:#94a3b8; margin:1rem 0 .25rem; }
  </style>
</head>
<body>
<h1>webssh selftest</h1>
<pre id="out">starting…</pre>
<script type="module">
// A module that does not load leaves the page reading "starting…" for ever,
// which looks like a hang instead of an error. Said once, plainly.
addEventListener('error', (e) => {
  const el = document.getElementById('out');
  if (el.textContent.trim() === 'starting…') {
    el.innerHTML = '<span class="fail">SELFTEST FAIL</span>\n\n'
      + 'the page itself failed to load: ' + (e.message || e.type) + '\n'
      + (e.filename ? 'at ' + e.lineno + ':' + e.colno + ' of ' + e.filename.split('/').pop() : '');
  }
});

// The transaction is built by the same code the real page uses. Reimplementing
// it here would test a copy, and the bugs this exists to catch were all about
// the real one disagreeing with the server.
import { signSolanaTransaction, warmUp, base58Decode } from './solana.js';

// Exercises worker + Go/WASM + SSH end to end, in two phases.
//
//   1. the transport: real key events, one per character, through the
//      WebSocket and into a shell
//   2. the Solana seam: a key made here, used to sign a transaction the
//      browser builds, checked by the Go side
//
// The second phase is the one that has no other coverage. Everything
// about how the browser builds a transaction and how the server reads it
// has to agree, and every disagreement so far looked fine until a
// signature failed to arrive in a terminal. A wallet is not needed for
// it: an ed25519 key generated here is the same kind of key, which is
// the whole reason a session can sign without one.
//
// ?bin=   path to the wssh binary in the session (default: wssh on PATH)
// ?rpc=   endpoint to fetch a live blockhash from. None is needed by default:
//          nothing here is broadcast, so the blockhash only has to be
//          well-formed, and the public RPCs refuse browser requests for CORS
//          reasons that have nothing to do with this test.
const out = document.getElementById('out');
const lines = [];
const say = (s) => { lines.push(s); out.innerHTML = lines.join('\n'); };
const enc = new TextEncoder();
const dec = new TextDecoder();

// There is nothing to click here, and there is nothing to stub either: the
// page does not ask, the wallet does. That is the arrangement this test now
// checks around rather than through - see the round trip below, which reads
// the signed bytes instead of a description of them.
//
// A terminal wraps its output in escape sequences and bracketed-paste markers,
// and they arrive glued to the line they precede. Stripped before anything is
// matched against, or a perfectly good transaction reads as noise.
const CLEAN = /\u001b\[[0-9;?]*[a-zA-Z]|\u001b\][^\u0007]*\u0007|\[\?\d+[hl]|\u001b[=>]/g;
const clean = (line) => line.replace(CLEAN, '').trim();

const params = new URLSearchParams(location.search);
const BIN = params.get('bin') || 'wssh';
// Default to devnet: mainnet rejects browser fetches with 403 because of CORS,
// and the test only needs a network that accepts requests with an Origin
// header. Pass ?rpc= to point at any other endpoint.
const RPC = params.get('rpc') || 'https://api.devnet.solana.com';

// A real blockhash, used because nothing here is sent anywhere and only the
// shape matters. It has to parse as a 32-byte base58 value, because that is
// what the transaction is built from.
const FIXED_BLOCKHASH = '2QaBotLgbzXTfMJH11nTp8KzsQKiejR3C7odjYvkd83Z';

// --- small helpers, kept here so the production page carries no test code ---

const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';

function base58(bytes) {
  let n = 0n;
  for (const b of bytes) n = n * 256n + BigInt(b);
  let out = '';
  while (n > 0n) { out = B58[Number(n % 58n)] + out; n /= 58n; }
  for (const b of bytes) { if (b !== 0) break; out = B58[0] + out; }
  return out;
}

const b64 = (bytes) => btoa(String.fromCharCode(...bytes));

function pem(der, label) {
  const body = (b64(new Uint8Array(der)).match(/.{1,64}/g) || []).join('\n');
  return `-----BEGIN ${label}-----\n${body}\n-----END ${label}-----\n`;
}

async function newKey() {
  const pair = await crypto.subtle.generateKey({ name: 'Ed25519' }, true, ['sign', 'verify']);
  return {
    pem: pem(await crypto.subtle.exportKey('pkcs8', pair.privateKey), 'PRIVATE KEY'),
    address: base58(new Uint8Array(await crypto.subtle.exportKey('raw', pair.publicKey))),
  };
}

async function blockhash() {
  if (!RPC) return FIXED_BLOCKHASH;

  const res = await fetch(RPC, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'getLatestBlockhash', params: [{ commitment: 'finalized' }] }),
  });
  const raw = await res.text();
  let body;
  try {
    body = JSON.parse(raw);
  } catch {
    throw new Error(`${RPC} answered with something that is not JSON (${res.status}): ${raw.slice(0, 120)}`);
  }
  if (body?.error) {
    throw new Error(`${RPC}: ${body.error.message}`);
  }
  const hash = body?.result?.value?.blockhash;
  if (!hash) {
    throw new Error(`${RPC} answered without a blockhash: ${raw.slice(0, 120)}`);
  }
  return hash;
}

// airdrop tops up a freshly-made key on devnet so simulateTransaction has an
// account to charge fees against. One SOL is more than enough for the
// transfers this test runs, and the RPC node gives it out for free on
// devnet. mainnet has no such thing, which is why the test defaults to
// devnet.
async function airdrop(address) {
  const res = await fetch(RPC, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      jsonrpc: '2.0', id: 1,
      method: 'requestAirdrop',
      params: [address, 1000000000],
    }),
  });
  const raw = await res.text();
  let body;
  try { body = JSON.parse(raw); } catch {
    throw new Error(`${RPC} answered with something that is not JSON (${res.status}): ${raw.slice(0, 120)}`);
  }
  if (body?.error) throw new Error(`${RPC}: ${body.error.message}`);
  const sig = body?.result;
  if (!sig) throw new Error(`${RPC} answered without a signature: ${raw.slice(0, 120)}`);

  // A requestAirdrop is a transfer; it has to be confirmed before the
  // account holds lamports. confirmTransaction returns null on success,
  // so absence is what we are after here.
  const conf = await fetch(RPC, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      jsonrpc: '2.0', id: 1,
      method: 'confirmTransaction',
      params: [sig, { commitment: 'confirmed' }],
    }),
  });
  const confText = await conf.text();
  let confBody;
  try { confBody = JSON.parse(confText); } catch {
    throw new Error(`${RPC} answered with something that is not JSON (${conf.status}): ${confText.slice(0, 120)}`);
  }
  if (confBody?.error) throw new Error(`${RPC}: ${confBody.error.message}`);
  return sig;
}

// simulateTransaction asks the RPC node to run a signed transaction without
// sending it, and returns the error it reports. The signature itself is not
// checked here - this is the page's chance to prove the transaction shape is
// something the cluster will accept, which is the same check a wallet's
// "simulate" button performs before asking for approval.
//
// A signature over a nonsense blob still verifies, and a transaction whose
// shape is wrong still parses. What catches a wrong shape is the cluster
// running the program: that is what we are after here.
async function simulateTransaction(signed) {
  // Solana's RPC takes the transaction bytes as a base58 string, not base64.
  const wire = solanaLib.VersionedTransaction.deserialize(base58Decode(signed)).serialize();
  const enc = base58(wire);
  const res = await fetch(RPC, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      jsonrpc: '2.0', id: 1,
      method: 'simulateTransaction',
      params: [enc, { sigVerify: false, replaceRecentBlockhash: false, commitment: 'processed' }],
    }),
  });
  const raw = await res.text();
  let body;
  try { body = JSON.parse(raw); } catch {
    throw new Error(`${RPC} answered with something that is not JSON (${res.status}): ${raw.slice(0, 120)}`);
  }
  if (body?.error) throw new Error(`${RPC}: ${body.error.message}`);
  const v = body?.result?.value;
  if (!v) throw new Error(`${RPC} answered without a value: ${raw.slice(0, 120)}`);
  if (v.err) {
    const ixNo = v.errInstructionError ? Object.keys(v.errInstructionError)[0] : null;
    const where = ixNo !== null ? ` at instruction ${ixNo}` : '';
    throw new Error(`simulateTransaction failed${where}: ${JSON.stringify(v.err)}`);
  }
  return v;
}

// --- phase 1: the transport ---

const w = new Worker('./worker.js');
let phase = 'connect';
let selfKey = null;
let solanaLib = null;
let txStartedAt = 0;
let acc = '';
const failures = [];
let transportDone = false;

function typeToShell(text) {
  for (const ch of text) w.postMessage({ type: 'input', data: enc.encode(ch) });
  w.postMessage({ type: 'input', data: enc.encode('\n') });
}

const CANARY = 'ORDERING_CANARY_12345';
// Nothing is broadcast, so this is only ever a shape that has to be right.
const LAMPORTS = 1;

async function start() {
  let credentials = { keys: [], passwords: [] };

  // The Solana library is fetched while phase 1 runs. It is large enough that
  // a cold fetch outlives the wait a caller would sit through, so the test
  // spends that time on the transport instead.
  solanaLib = await warmUp();
  say('solana library: ' + (typeof solanaLib === 'string' ? solanaLib : 'ready'));

  try {
    selfKey = await newKey();
    say('made an ed25519 key in the page: ' + selfKey.address);
    // The key is offered for authentication and exposed as an agent, so the
    // transaction phase has something to sign with. No wallet is involved:
    // this is the path a session with a key takes.
    credentials = {
      keys: [{ name: 'selftest', privateKey: selfKey.pem }],
      passwords: [],
      // Inside the blob, not beside it: the worker forwards only credentials.
      // Without this there is no agent, and the transaction phase below would
      // be testing a socket nothing is listening on.
      forwardAgent: true,
    };
  } catch (err) {
    say('<span class="skip">could not make a key (' + err.message + '); the transaction phase will be skipped</span>');
    selfKey = null;
  }

  w.postMessage({
    type: 'connect',
    url: `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`,
    user: 'selftest', cols: 80, rows: 24,
    credentials,
  });
}

async function phase2() {
  say('');
  say('<h2>phase 2 — the Solana seam</h2>');

  if (!selfKey) {
    say('<span class="skip">SKIP — no key to sign with</span>');
    finish();
    return;
  }
  const key = selfKey;

  let bh = '';
  try {
    bh = await blockhash();
  } catch (err) {
    say('<span class="skip">SKIP — no blockhash (' + err.message + '); pass ?rpc= to a reachable endpoint</span>');
    finish();
    return;
  }
  if (!bh) {
    say('<span class="skip">SKIP — no blockhash</span>');
    finish();
    return;
  }
  say('blockhash ' + bh + (RPC ? ' (live)' : ' (fixed; nothing is broadcast)'));

  // To and payer are both this key: a transaction whose fee payer it is not
  // will not send, and the point here is the shape not the money.
  const cmd = `${BIN} sol-tx transfer --to ${key.address} --lamports ${LAMPORTS} ` +
              `--blockhash ${bh} --payer ${key.address}`;
  say('$ ' + cmd);

  acc = '';
  phase = 'tx';
  txStartedAt = Date.now();
  typeToShell(cmd);
}

w.onmessage = async (e) => {
  try {
    await handle(e);
  } catch (err) {
    // A throw in here used to disappear as an unhandled rejection, leaving the
    // page looking exactly as it does when something has hung. A test that
    // cannot fail visibly is not a test.
    say('<span class="fail">FAIL — the page threw: ' + (err && err.message ? err.message : err) + '</span>');
    failures.push('page');
    finish();
  }
};

async function handle(e) {
  const m = e.data;

  if (m.type === 'data') {
    acc += dec.decode(new Uint8Array(m.payload));

    if (phase === 'connected') {
      typeToShell(`echo ${CANARY}\n`);
      phase = 'transport';

    } else if (phase === 'transport') {
      // The typed line is echoed as it is entered, so the command text itself
      // already contains the token. The real output is a second, standalone
      // occurrence on a line of its own.
      const first = acc.indexOf(CANARY);
      if (first !== -1 && acc.indexOf(CANARY, first + CANARY.length) !== -1) {
        // phase moves before the await: every later chunk carries the same
        // canary, and without this the whole of phase 2 runs once per chunk.
        phase = 'handover';
        say('<span class="pass">PASS — browser → WebSocket → SSH → shell</span>');
        transportDone = true;
        await phase2();
      }

    } else if (phase === 'tx') {
      // Wait for the command rather than judging the first chunk: the shell
      // echoes its prompt before anything runs, and a signed transaction is
      // only the last line of several.
      // A terminal interleaves prompts and escape sequences with what a command
      // prints, so the answer is somewhere in the output rather than at the end
      // of it. Judging the last line alone reads the next prompt and misses a
      // transaction that arrived perfectly well.
      const plain = acc.split(/\r?\n/).map(clean).filter(Boolean);
      const last = plain[plain.length - 1] || '';
      const signed = plain.filter((l) => l.length > 100 && /^[1-9A-HJ-NP-Za-km-z]+$/.test(l)).pop() || '';

      if (/^ERROR/i.test(last) || /refused|could not|not authorized|no wallet/i.test(last)) {
        phase = 'done';
        say('<span class="fail">FAIL — the transaction was refused</span>');
        say(last);
        failures.push('transaction');
        finish();
        return;
      }

      if (signed) {
        phase = 'done';

        // What the approver was shown is the wallet's business now, and it
        // lives in the extension where this test cannot read it. What it can
        // check is stronger anyway: that the bytes the wallet signed are the
        // transaction that was asked for.
        const problems = checkRoundTrip(signed, { address: selfKey.address, lamports: LAMPORTS });
        if (problems.length) {
          say('<span class="fail">FAIL — it is a transaction, but not the one asked for</span>');
          problems.forEach((p) => say('  - ' + p));
          failures.push('round trip');
        } else {
          say('<span class="pass">PASS — the browser built the transaction and signed it</span>');
          say('it reads back as the requested transfer: payer, program, account and amount all match');
        }
        say('signed transaction: ' + signed.slice(0, 60) + '… (' + signed.length + ' base58 chars)');

        // A fee payer that does not exist on the cluster trips the simulator
        // with AccountNotFound, which reads as a phantom sign error rather
        // than the configuration mistake it actually is. Skip the simulate
        // step rather than fail the test when the cluster refuses the airdrop
        // (devnet is rate-limited, local validators have no airdrop method).
        if (RPC) {
          try {
            await airdrop(selfKey.address);
            say('airdropped 1 SOL to ' + selfKey.address);
          } catch (err) {
            say('<span class="skip">SKIP — could not fund the test key for the simulate step: ' + err.message + '</span>');
            finish();
            return;
          }
        }

        // The signature and the byte-level shape are checked above. Now check
        // the third thing: that the cluster is willing to run it. A wallet's
        // "simulate" is the same call, and the only place this kind of mistake
        // surfaces is when the answer is fed back to a person who expected
        // the wallet to have refused already.
        try {
          await simulateTransaction(signed);
          say('<span class="pass">PASS — the cluster simulates the transaction without error</span>');
        } catch (err) {
          say('<span class="fail">FAIL — the cluster refuses to simulate: ' + err.message + '</span>');
          failures.push('simulate');
        }
        finish();
        return;
      }

      if (Date.now() - txStartedAt > 20000) {
        phase = 'done';
        say('<span class="fail">FAIL — nothing came back within 20s</span>');
        say('last line: ' + (last || '(nothing)'));
        say('everything the session printed:\n' + plain.slice(-6).join('\n'));
        failures.push('transaction');
        finish();
      }
    }
    return;
  }

  if (m.type === 'connected') {
    say('<h2>phase 1 — the transport</h2>');
    say('connected to ' + location.host);
    phase = 'connected';
    typeToShell('true\n');
    return;
  }

  // A transaction request from the agent. Answering it is the whole point of
  // phase 2: the browser builds, the session's key signs, and what comes back
  // has to be a transaction Go is willing to verify.
  if (m.type === 'prompt' && m.kind === 'soltx') {
    const { id, detail, extra } = m;
    signSolanaTransaction(detail, extra === 'build')
      .then((answer) => w.postMessage({ type: 'promptAnswer', id, value: JSON.stringify(answer) }))
      .catch((err) => w.postMessage({
        type: 'promptAnswer', id,
        value: JSON.stringify({ refusal: String(err?.message || err) }),
      }));
    return;
  }

  if (m.type === 'error') {
    say('<span class="fail">ERROR: ' + m.message + '</span>');
    failures.push('transport');
    finish();
    return;
  }

  if (m.type === 'closed' && phase !== 'done') {
    say('<span class="fail">session closed early</span>');
    failures.push('transport');
    finish();
  }
};

w.onerror = (e) => {
  say('<span class="fail">WORKER ERROR: ' + e.message + '</span>');
  failures.push('worker');
  finish();
};

// A signed transaction coming back is not the same as the transaction that was
// asked for. This reads the answer and checks it against the request: a
// signature proves who signed, not what they signed, and "what" is the part
// that decides whether anyone lost money.
function checkRoundTrip(signed, want) {
  if (!solanaLib || typeof solanaLib === 'string') {
    return ['the library was not loaded, so the answer could not be read back'];
  }
  const { VersionedTransaction, SystemProgram } = solanaLib;

  let tx;
  try {
    tx = VersionedTransaction.deserialize(base58Decode(signed));
  } catch (err) {
    return ['the answer did not deserialize: ' + err.message];
  }

  const problems = [];
  const keys = (tx.message?.staticAccountKeys || []).map((k) => k.toBase58());
  const program = SystemProgram.programId.toBase58();

  // The fee payer is whoever signs, and it has to be that account or the
  // transaction will not send.
  if (keys[0] !== want.address) {
    problems.push(`fee payer is ${keys[0]}, want ${want.address}`);
  }
  if (!keys.includes(program)) {
    problems.push('the System Program is not among the accounts');
  }
  if (!keys.includes(want.address)) {
    problems.push('the account it was for is not among the accounts');
  }

  const instructions = tx.message?.compiledInstructions || [];
  if (instructions.length < 1) {
    problems.push(`${instructions.length} instructions, want at least 1`);
    return problems;
  }

  // Phantom prepends a SetComputeUnitLimit and a SetComputeUnitPrice before
  // signing, so a tx built for one transfer usually arrives carrying three
  // instructions. The test asks for one transfer; verify that, not the rest.
  const transferIx = instructions.find((ix) =>
    keys[ix.programIdIndex] === program);
  if (!transferIx) {
    problems.push('no instruction calls the System Program');
    return problems;
  }

  // What was asked for, built by the library rather than by hand here: a test
  // that re-derives the encoding is testing its own arithmetic.
  const ix = transferIx;
  const expected = solanaLib.SystemProgram.transfer({
    fromPubkey: new solanaLib.PublicKey(keys[0]),
    toPubkey: new solanaLib.PublicKey(want.address),
    lamports: want.lamports,
  }).data;

  const got = ix.data instanceof Uint8Array ? ix.data : Uint8Array.from(Object.values(ix.data || {}));

  const asList = (a) => Array.from(a).join(',');
  if (got.length !== expected.length) {
    problems.push(`instruction data is ${got.length} bytes, want ${expected.length}`);
    problems.push('  got  ' + asList(got));
    problems.push('  want ' + asList(expected));
  } else if (!got.every((b, i) => b === expected[i])) {
    problems.push('instruction data differs from the transfer that was asked for');
    problems.push('  got  ' + asList(got));
    problems.push('  want ' + asList(expected));
  }

  if (keys[ix.programIdIndex] !== program) {
    problems.push('the instruction does not call the System Program');
  }
  const accounts = (ix.accountKeyIndexes || []).map((i) => keys[i]);
  if (!accounts.includes(want.address)) {
    problems.push('the instruction does not name the account it is for');
  }
  return problems;
}

function finish() {
  phase = 'done';
  out.innerHTML =
    (failures.length
      ? '<span class="fail">SELFTEST FAIL</span>'
      : '<span class="pass">SELFTEST PASS</span>') +
    '\n\n' + lines.join('\n');
  w.postMessage({ type: 'input', data: enc.encode('exit\n') });
}

// A failing run has to say what it managed before it stopped, which is the
// only thing a selftest is for. Replacing the output here threw away every
// line above.
setTimeout(() => {
  if (phase === 'done') return;
  say('<span class="fail">SELFTEST FAIL — stopped at phase=' + phase + '</span>');
  if (acc.trim()) {
    say('');
    say('last output from the session:');
    say(acc.slice(-800));
  }
  finish();
}, 25000);

start();
</script>
</body>
</html>
