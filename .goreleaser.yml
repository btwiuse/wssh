# Release configuration.
#
# Three binaries per platform, named `{binary}_{version}_{os}_{arch}`, because
# that is what `wssh upgrade` looks for. It reads the release assets through
# go-selfupdate, which matches on the platform suffix and takes the first asset
# that fits - so the name has to carry the version, the platform and which of
# the three binaries it is, and the upgrade command checks the last part itself
# rather than trusting the order GitHub happens to return them in.
#
# The version and commit are stamped in. Without them a released binary reports
# "dev" and `wssh upgrade` refuses to run, because there is nothing to compare
# a release against.
#
# Only macOS and Linux on amd64 and arm64 for now. Adding a platform means
# adding it to every build below, and one that nobody has a machine for is a
# release that lies about where it runs.

version: 2

project_name: wssh

before:
  hooks:
    - go mod download
    # The browser client is a build artefact of the wssh binary, not a separate
    # download: it is compiled into it and served from it. A release without it
    # would ship a server whose front end dies on a 404, so it is built here
    # rather than left to whoever cuts the release.
    - ./client/build.sh

builds:
  - id: wssh
    main: ./cmd/wssh
    binary: wssh
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }}

  - id: sol-tx
    main: ./cmd/sol-tx
    binary: sol-tx
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }}

  - id: sol-keys
    main: ./cmd/sol-keys
    binary: sol-keys
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }}

# One archive entry per build, rather than one entry naming all three.
#
# With a single entry naming every build, goreleaser archived one build and
# left the other two as loose binaries on the release - the snapshots here
# produced twelve binaries and four archives. One entry per build says which
# archive belongs to which binary, and the name carries it either way.
#
# One binary per archive, at the top level inside it: that is what
# selfupdate.UpdateTo looks for when it unpacks.
archives:
  - id: wssh
    ids: [wssh]
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # The binary, plus a licence if the repository ever grows one. An empty
    # list does not mean "none" here: goreleaser falls back to its defaults,
    # which include every README*, and the README in this repository is a
    # note to self rather than documentation - it has no business in a
    # published archive.
    files:
      - src: license*
      - src: LICENSE*

  - id: sol-tx
    ids: [sol-tx]
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: license*
      - src: LICENSE*

  - id: sol-keys
    ids: [sol-keys]
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: license*
      - src: LICENSE*

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
  footer: |
    ---
    Installed with `wssh upgrade`, or by hand from the asset for your platform.
    Each archive holds a single binary.